name: Supplier tariff audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: enerprice-supplier-tariff-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'LenFaki/home-assistant-nl-day-ahead-prices' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pytest-asyncio aiohttp
      - name: Validate registry and test maintenance tooling
        run: |
          python scripts/audit_supplier_registry.py --validate-only
          pytest tests/test_registry_maintenance.py tests/test_remote_registry.py tests/test_supplier_registry.py
          node --test tests/test_supplier_audit_issue.cjs
      - name: Generate deterministic reports
        shell: bash
        run: |
          AUDIT_DATE=$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Europe/Amsterdam")).date().isoformat())')
          for format in json markdown; do
            status=0
            python scripts/audit_supplier_registry.py --date "$AUDIT_DATE" --format "$format" > "audit.$format" || status=$?
            if [ "$status" -gt 1 ]; then exit "$status"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: supplier-tariff-audit
          path: |
            audit.json
            audit.markdown
      - name: Synchronize central audit issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
            const body = fs.readFileSync('audit.markdown', 'utf8');
            const syncIssue = require('./.github/scripts/supplier-audit-issue.cjs');
            await syncIssue({ github, context, core, report, body });
